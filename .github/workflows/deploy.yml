name: Pubblica Egyphone
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: egyphone-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify independent site
        run: |
          test "$(cat CNAME)" = "egyphone.beparytech.it"
          grep -q 'egyphone-kqdcbrpykaboabjglwxu-auth-token' app.js
          grep -q '7834b431-968b-467a-be04-96efe3aaf132' app.js
          node --check app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
